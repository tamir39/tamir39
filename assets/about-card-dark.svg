<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="324" viewBox="0 0 1000 324" role="img" aria-labelledby="title"><title id="title">About Tamir. Frontend developer and UI/UX designer at Twohearts Technology; computer science student at Ton Duc Thang University. Visual craft, thoughtful flows, connected interfaces. Exploring UI/UX and full-stack development through Zuno.</title><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.trace{opacity:0}
@media(prefers-reduced-motion:no-preference){
  .bar,.draw{animation:highlight 5s ease-in-out infinite;animation-delay:var(--delay,0ms)}
  .pulse{animation:highlight 3.2s ease-in-out infinite;animation-delay:var(--delay,0ms)}
  .trace{opacity:1;stroke-dasharray:.12 .88;animation:trace 7s linear infinite;animation-delay:var(--delay,0ms)}
  .orbit{transform-origin:var(--center);animation:orbit 12s linear infinite}
  .float{transform-box:fill-box;transform-origin:center;animation:float 6s ease-in-out infinite}
  .cell{animation:highlight 5.6s ease-in-out infinite;animation-delay:var(--delay,0ms)}
  @keyframes highlight{0%,100%{opacity:1}50%{opacity:.65}}
  @keyframes trace{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
  @keyframes orbit{to{transform:rotate(360deg)}}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-2px) rotate(2deg)}}
}
</style><rect x=".5" y=".5" width="999" height="323" rx="10" fill="#0d1117" stroke="#3d444d"/><text x="24" y="39" font-size="23" fill="#f0f6fc" font-weight="600" >Design sense. Engineering mind.</text><text x="24" y="71" font-size="17" fill="#4493f8" font-weight="600" >Frontend Developer &amp; UI/UX Designer</text><text x="24" y="98" font-size="15" fill="#9198a1" font-weight="400" >at Twohearts Technology</text><text x="600" y="35" font-size="12" fill="#3fb950" font-weight="600" class="mono">STUDYING + BUILDING</text><text x="600" y="63" font-size="16" fill="#f0f6fc" font-weight="500" >Computer science · Ton Duc Thang University</text><text x="600" y="89" font-size="14" fill="#9198a1" font-weight="400" >Exploring deeper UI/UX practice + full-stack development.</text><text x="600" y="113" font-size="14" fill="#9198a1" font-weight="400" >Putting it into practice through my own product, Zuno.</text><path d="M24 134H976" stroke="#3d444d"/><g><rect x="24" y="153" width="306" height="147" rx="7" fill="#151b23" stroke="#3d444d"/><g transform="translate(44 174)"><path class="draw" style="--delay:-0ms" d="M0 0H26V24H0ZM0 7H26M8 7V24" stroke="#4493f8" stroke-width="1.7" fill="none" stroke-linejoin="round"/></g><text x="87" y="194" font-size="17" fill="#f0f6fc" font-weight="600" >Visual craft</text><text x="44" y="229" font-size="14" fill="#9198a1" font-weight="400" >Layout, type, color, and the</text><text x="44" y="251" font-size="14" fill="#9198a1" font-weight="400" >details that make a UI feel right.</text><path d="M44 279H310" stroke="#3d444d"/><path class="trace" pathLength="1" style="--delay:-0ms" d="M44 279H310" stroke="#4493f8" stroke-width="2" stroke-linecap="round"/></g><g><rect x="346" y="153" width="306" height="147" rx="7" fill="#151b23" stroke="#3d444d"/><g transform="translate(366 174)"><path class="draw" style="--delay:-750ms" d="M0 12H8M18 12H26M10 2H17V9H10ZM10 16H17V23H10ZM14 9V16" stroke="#4493f8" stroke-width="1.7" fill="none" stroke-linejoin="round"/></g><text x="409" y="194" font-size="17" fill="#f0f6fc" font-weight="600" >Thoughtful flows</text><text x="366" y="229" font-size="14" fill="#9198a1" font-weight="400" >Clear navigation and interactions,</text><text x="366" y="251" font-size="14" fill="#9198a1" font-weight="400" >from first click to final step.</text><path d="M366 279H632" stroke="#3d444d"/><path class="trace" pathLength="1" style="--delay:-1200ms" d="M366 279H632" stroke="#4493f8" stroke-width="2" stroke-linecap="round"/></g><g><rect x="668" y="153" width="306" height="147" rx="7" fill="#151b23" stroke="#3d444d"/><g transform="translate(688 174)"><path class="draw" style="--delay:-1500ms" d="M8 4L0 12L8 20M18 4L26 12L18 20M15 2L11 22" stroke="#4493f8" stroke-width="1.7" fill="none" stroke-linejoin="round"/></g><text x="731" y="194" font-size="17" fill="#f0f6fc" font-weight="600" >Connected interfaces</text><text x="688" y="229" font-size="14" fill="#9198a1" font-weight="400" >Visual design connected to</text><text x="688" y="251" font-size="14" fill="#9198a1" font-weight="400" >working application logic.</text><path d="M688 279H954" stroke="#3d444d"/><path class="trace" pathLength="1" style="--delay:-2400ms" d="M688 279H954" stroke="#4493f8" stroke-width="2" stroke-linecap="round"/></g></svg>