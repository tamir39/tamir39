  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
  <style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,monospace}.orbit{transform-origin:970px 210px;animation:orbit 32s linear infinite}@keyframes orbit{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.orbit{animation:none}}</style>
</defs>
