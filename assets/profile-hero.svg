<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Tamir — frontend developer and UI/UX designer</title>
<desc id="desc">Interfaces with intention. Phí Vương Tường Tâm. Visual detail, thoughtful flows. Frontend development and UI/UX design.</desc>
