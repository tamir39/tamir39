greSQL</text><rect x="659" y="224" width="128" height="29" rx="6" fill="var(--paper)" stroke="var(--line)"/><text x="671" y="244" font-size="14" fill="var(--ink)" font-weight="500" >Drizzle ORM</text><circle class="pulse" cx="535" cy="284" r="4" fill="var(--green)"/><text x="549" y="289" font-size="13" fill="var(--muted)" font-weight="400" >Learning through Zuno</text><path d="M746 284H953" stroke="var(--line)" stroke-width="2"/><path class="trace" pathLength="1" style="--delay:-3000ms" d="M746 284H953" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/></svg>