<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="338" viewBox="0 0 1000 338" role="img" aria-labelledby="title"><title id="title">Toolkit. Core frontend: React, TypeScript, Tailwind CSS, Next.js, Vite. Components and motion: shadcn/ui, Radix UI, Motion / Framer Motion. State and data: Zustand, TanStack Query. Growing full-stack experience through Zuno: PostgreSQL and Drizzle ORM.</title><style>:root{--paper:#ffffff;--ink:#1f2328;--muted:#59636e;--accent:#0969da;--line:#d1d9e0;--surface:#f6f8fa;--green:#1a7f37;--accentSurface:#ddf4ff;--level-0:#ebedf0;--level-1:#9be9a8;--level-2:#40c463;--level-3:#30a14e;--level-4:#216e39}@media(prefers-color-scheme:dark){:root{--paper:#0d1117;--ink:#f0f6fc;--muted:#9198a1;--accent:#4493f8;--line:#3d444d;--surface:#151b23;--green:#3fb950;--accentSurface:#121d2f;--level-0:#161b22;--level-1:#0e4429;--level-2:#006d32;--level-3:#26a641;--level-4:#39d353}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.trace{opacity:0}
@media(prefers-reduced-motion:no-preference){
  .bar,.draw{animation:highlight 5s ease-in-out infinite;animation-delay:var(--delay,0ms)}
  .pulse{animation:highlight 3.2s ease-in-out infinite;animation-delay:var(--delay,0ms)}
  .trace{opacity:1;stroke-dasharray:.12 .88;animation:trace 7s linear infinite;animation-delay:var(--delay,0ms)}
  .orbit{transform-origin:var(--center);animation:orbit 12s linear infinite}
  .float{transform-box:fill-box;transform-origin:center;animation:float 6s ease-in-out infinite}
  .cell{animation:highlight 5.6s ease-in-out infinite;animation-delay:var(--delay,0ms)}
  @keyframes highlight{0%,100%{opacity:1}50%{opacity:.65}}
  @keyframes trace{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
  @keyframes orbit{to{transform:rotate(360deg)}}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-2px) rotate(2deg)}}
}
