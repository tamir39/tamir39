<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="167" viewBox="0 0 1000 167" role="img" aria-labelledby="title"><title id="title">Zuno — Private spaces. Shared moments.</title><style>:root{--paper:#ffffff;--ink:#1f2328;--muted:#59636e;--accent:#0969da;--line:#d1d9e0;--surface:#f6f8fa;--green:#1a7f37;--accentSurface:#ddf4ff;--level-0:#ebedf0;--level-1:#9be9a8;--level-2:#40c463;--level-3:#30a14e;--level-4:#216e39}@media(prefers-color-scheme:dark){:root{--paper:#0d1117;--ink:#f0f6fc;--muted:#9198a1;--accent:#4493f8;--line:#3d444d;--surface:#151b23;--green:#3fb950;--accentSurface:#121d2f;--level-0:#161b22;--level-1:#0e4429;--level-2:#006d32;--level-3:#26a641;--level-4:#39d353}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.trace{opacity:0}
@media(prefers-reduced-motion:no-preference){
  .bar,.draw{animation:highlight 5s ease-in-out infinite;animation-delay:var(--delay,0ms)}
  .pulse{animation:highlight 3.2s ease-in-out infinite;animation-delay:var(--delay,0ms)}
  .trace{opacity:1;stroke-dasharray:.12 .88;animation:trace 7s linear infinite;animation-delay:var(--delay,0ms)}
  .orbit{transform-origin:var(--center);animation:orbit 12s linear infinite}
  .float{transform-box:fill-box;transform-origin:center;animation:float 6s ease-in-out infinite}
  .cell{animation:highlight 5.6s ease-in-out infinite;animation-delay:var(--delay,0ms)}
  @keyframes highlight{0%,100%{opacity:1}50%{opacity:.65}}
  @keyframes trace{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
  @keyframes orbit{to{transform:rotate(360deg)}}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-2px) rotate(2deg)}}
}
</style><rect x=".5" y=".5" width="999" height="166" rx="10" fill="var(--paper)" stroke="var(--line)"/><text x="28" y="32" font-size="12" fill="var(--accent)" font-weight="600" class="mono">PERSONAL APPLICATION / FULL-STACK PWA</text><text x="26" y="78" font-size="37" fill="var(--ink)" font-weight="600" >Zuno</text><text x="28" y="111" font-size="20" fill="var(--ink)" font-weight="400" >Private spaces. Shared moments.</text><text x="28" y="143" font-size="14" fill="var(--muted)" font-weight="400" >Zones · Timelines · Posts · Votes</text><g transform="translate(708 24)"><rect width="264" height="118" rx="8" fill="var(--surface)" stroke="var(--line)"/><path d="M30 24V95" stroke="var(--line)"/><g class="reveal" style="--delay:0ms"><circle class="pulse" style="--delay:0ms" cx="30" cy="28" r="5" fill="var(--accent)"/><path class="draw" pathLength="1" d="M50 28H234" stroke="var(--muted)" stroke-width="4" style="--delay:0ms"/></g><g class="reveal" style="--delay:160ms"><circle class="pulse" style="--delay:600ms" cx="30" cy="60" r="5" fill="var(--green)"/><path class="draw" pathLength="1" d="M50 60H204" stroke="var(--muted)" stroke-width="4" style="--delay:160ms"/></g><g class="reveal" style="--delay:320ms"><circle class="pulse" style="--delay:1200ms" cx="30" cy="92" r="5" fill="var(--accent)"/><path class="draw" pathLength="1" d="M50 92H234" stroke="var(--muted)" stroke-width="4" style="--delay:320ms"/></g></g></svg>